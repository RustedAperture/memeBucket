version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    ignore:
      # typescript-eslint (via eslint-config-next) crashes on TS 7; lift once it supports it.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/apps/desktop/src-tauri"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
